[project]
name = "leuvengpx"
version = "0.2.0"
description = "Generate a static Leuven GPX route website."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Lode Nachtergaele" }]
dependencies = [
    "gpxpy>=1.6.2",
    "numpy>=2.0.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
